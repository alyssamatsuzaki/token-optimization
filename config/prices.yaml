# Official direct-provider prices. These override anything pulled by `tokop sync-models`.
#
# Every entry carries the URL it was read from, the date it was read, and whether it was
# checked against that page (SPEC.md non-negotiable 4). `verified: false` is not a failure
# state — it is the honest label for a number nobody has confirmed, and the UI marks it.
#
# Cache rates are written out rather than derived, even where they follow Anthropic's
# multipliers exactly, so that a future price that breaks the pattern needs no code change.
# Units are US dollars per million tokens.

prices:
  claude-opus-5:
    provider: anthropic
    display_name: Claude Opus 5
    input: 5
    output: 25
    cache_write_5m: 6.25      # 1.25x base input
    cache_write_1h: 10        # 2x base input
    cache_read: 0.50          # 0.1x base input
    batch_discount: 0.5
    min_cacheable_tokens: 512
    context_tokens: 1000000
    max_output_tokens: 128000
    tool_use_system_prompt_tokens: 286   # tool_choice auto/none; 406 for any/tool
    tokenizer_generation: newer          # Claude 4.7 onward, ~30% more tokens for the same text
    provenance:
      source_url: https://platform.claude.com/docs/en/about-claude/pricing
      retrieved: 2026-09-11
      verified: true

