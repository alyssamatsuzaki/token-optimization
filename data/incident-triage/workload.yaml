# A second workload, and not the demo (UPGRADE_V4.md M15).
#
# Its whole job is to show the engine runs on a workload it did not generate: different domain,
# different answer mix — escalation codes, team names and yes/no rather than money and day
# counts — and a dataset read from a file that a committed script produced, not from a generator
# the engine can import. `tests/test_no_demo_imports.py` fails if proving it reaches for the
# demo.
#
# Everything here is simulated and says so. See `dataset_provenance` and `simulation` below: the
# tasks were written by `scripts/make_incident_triage.py` and the answers by the in-process
# simulated provider at the rates this file declares. None of it is evidence about production.

workload:
  id: incident-triage
  name: Incident triage from a runbook
  description: >-
    An on-call assistant answering one question at a time about an alert, using a runbook that
    maps signatures to escalation codes, owning teams and out-of-hours paging rules. Two of the
    question shapes turn on overrides that beat the signature's own rule, which is where a
    cheaper model is most likely to go wrong.
  dataset:
    generator: script:make_incident_triage
    seed: 20260915
    size: 150
    calibration_size: 51
    source: dataset.jsonl
    grounding: runbook.md
  fixtures: incident-triage
  margin: 0.03
  latency_sensitive: true
  allowed_providers: [anthropic, simulated]
  scorer_features:
    - output_parses
    - answer_type_matches
    - output_length
    - question_length
    - question_numerals

# ------------------------------------------------------------------ provenance
#
# Declared honestly, and it refuses certification for exactly the reason the demo's does: not
# one of these tasks was observed in production.
dataset_provenance:
  real_traffic_items: 0
  model_generated_items: 0
  program_generated_items: 150
  generators: ["scripts/make_incident_triage.py"]
  real_traffic_accumulating: false
  notes:
    - >-
      Templated by a committed script from a fixed runbook, so every answer is derivable and a
      wrong answer is a reasoning failure rather than missing knowledge. No model wrote any of
      it, which is why the model-generated count is zero and the collapse checks have nothing
      to bite on. It is still not traffic anybody observed.

# ------------------------------------------------------------------ simulation
#
# The invented numbers, in the workload they belong to rather than in the engine. A reader
# auditing any result from this workload finds the rates that produced it here.
simulation:
  accuracy:
    cheap: 0.74
    mid: 0.88
    frontier: 0.96
  accuracy_by_type:
    # The overrides are the hard part: a rule that beats another rule is where a cheap model
    # answers from the signature and stops reading. The gap between tiers is widest here on
    # purpose, because a workload where every tier scores the same cannot demonstrate routing.
    cheap: {lookup: 0.88, rule: 0.78, override: 0.58}
    mid: {lookup: 0.96, rule: 0.90, override: 0.80}
    frontier: {lookup: 0.99, rule: 0.97, override: 0.92}
  parse_failure_rate: 0.015
  notes:
    - >-
      These are parameters, not measurements. They set what the simulated provider does; they
      are not an estimate of what any real model would do on this task.

pipelines:
  B0:
    name: Current pipeline
    description: The shape an on-call assistant usually ships as, runbook last and no contract.
    model_role: frontier
    max_tokens: 2000
    notes:
      - The runbook sits after the question, so nothing in front of it can be cached.
      - No output contract, so the answer has to be found in prose.
    known_antipatterns:
      PL01: The runbook is identical on every call and sits after the volatile question.
      PL06: No cache breakpoint at all, so every call pays full input price.
    system:
      - label: instructions
        text: |-
          You are an experienced site reliability engineer helping the on-call rota. Please be
          thorough and explain your reasoning carefully. Thank you for your help with this.

          Work through the alert, find the governing entry in the runbook, apply any overrides,
          and explain what you concluded and why.
    user:
      - label: question
        text: "{{question}}"
      - label: runbook
        text: |-
          Here is the runbook to use:

          {{grounding}}

  B1:
    name: Cache-friendly order
    description: The same prompt with the runbook first, behind a cache breakpoint.
    model_role: frontier
    max_tokens: 2000
    notes:
      - Identical text to B0. Only the order changed, and with it the bill.
    system:
      - label: runbook
        text: |-
          You are an experienced site reliability engineer helping the on-call rota.

          Here is the runbook to use:

          {{grounding}}
        cache: 5m
      - label: instructions
        text: |-
          Work through the alert, find the governing entry in the runbook, apply any overrides,
          and explain what you concluded and why.
    user:
      - label: question
        text: "{{question}}"

  B2:
    name: Tightened prompt with an output contract
    description: Cache-friendly order, the courtesy dropped, and an answer a parser can read.
    model_role: frontier
    max_tokens: 200
    output_contract: json_answer
    notes:
      - The output contract takes the answer from a paragraph to a field.
    system:
      - label: runbook
        text: |-
          You triage alerts using the runbook below.

          {{grounding}}
        cache: 5m
      - label: contract
        text: |-
          Find the runbook entry that governs the alert. Apply any override that applies: an
          alert folded into an open incident does not page, and during a change freeze every
          platform-owned signature pages.

          Reply with JSON only: {"answer": "<the answer>", "evidence": "<the runbook line>"}.
          For a yes/no question the answer is exactly "yes" or "no".
    user:
      - label: question
        text: "{{question}}"

cascades:
  B3:
    name: Cascade on the B2 prompt
    description: Route each alert to the cheapest tier that can be trusted with it.
    base_pipeline: B2
    tiers: [cheap, mid, frontier]
    scorer: logistic-v1
    notes:
      - >-
        The overrides are where the tiers differ most, so this is the workload shape a cascade
        should do well on — which is the point of running it: the demo is one shape, and one
        shape is not evidence that routing generalises.
